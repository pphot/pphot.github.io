base_url = "https://pphot.blog"
feed_url = "https://pphot.blog/atom.xml"
title = "Phuong"
description = "A lifestyle blog about journeys, books, photography, and personal reflections"
language = "en"
output_dir = "public"
summary_length = 2

# Chroma style for fenced code blocks. dracula keeps its own dark background in
# both themes.
syntax_theme = "dracula"

minify_css = true
minify_html = true
minify_js = true
minify_json = true
minify_svg = true
minify_xml = true

[extra]
name = "Phuong"
bio = "Sharing life's journey · daily thoughts · travel · books"
avatar = "/img/avatar.webp"
img = "/img/post-cover.webp"
hero_image = "/img/hero.webp"
hero_image_1280 = "/img/hero-1280.webp"
hero_image_480 = "/img/hero-480.webp"
hero_image_768 = "/img/hero-768.webp"
default_post_cover = "/img/post-cover.webp"

# Loaded on demand, and only on pages that contain a mermaid fence.
mermaid_src = "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs"

links = [
  { name = "Instagram", icon = "instagram", url = "https://instagram.com/phuong_phot" },
  { name = "Email", icon = "email", url = "mailto:pphot@gmail.com" },
]

sections = [
  { name = "thoughts", path = "/thoughts" },
  { name = "journal", path = "/journal" },
  { name = "books", path = "/books" },
  { name = "about", path = "/about" },
]

footer_links = [
  { name = "Archive", path = "/archive" },
  { name = "Tags", path = "/tags" },
  { name = "Categories", path = "/categories" },
  { name = "Series", path = "/series" },
  { name = "Contact", path = "/contact" },
  { name = "RSS", path = "/atom.xml" },
]

currently_status = "exploring new places"
currently_status_link = "/journal/"

skip_to_content = "Skip to content"
ended_words = "Thanks for reading. If this gave you something to think about, I would love to hear your thoughts."

# Homepage
home_welcome_prefix = "Welcome to"
home_featured_title = "Featured Stories"
home_featured_subtitle = "Handpicked moments and reflections"
home_featured_count = 6
home_latest_title = "Latest Posts"
home_latest_subtitle = "Recent writing from every corner of the blog"
home_latest_count = 9
recent_more_text = "Browse the archive"

# Section pages
journal_title = "📔 Journal"
journal_subtitle = "Travel stories, vacation memories, life adventures, plus food stories and recipes"
thoughts_title = "💭 Daily Thoughts"
thoughts_subtitle = "Short moments, daily practice, honest reflections"
books_title = "📚 Books"
books_subtitle = "Reviews, reflections, and literary discoveries"

about_title = "About Pphot"
archive_title = "Archive"
search_title = "Search"
search_placeholder = "Search posts, books, travel notes…"

# Taxonomy pages
tags_title = "All Tags"
tags_subtitle = "Browse every post by topic"
categories_title = "Categories"
categories_subtitle = "Journal entries, book reviews, and daily thoughts"
series_title = "Series"
series_subtitle = "Multi part reads, in reading order"

# Post page
post_read_time_suffix = "min read"
post_share_title = "Share this post"
post_share_x = "X"
post_share_facebook = "Facebook"
post_share_email = "Email"
post_share_copy = "Copy link"

comment_endpoint = "https://comment-blog.tienduy-nguyen-dev.workers.dev"
comments_title = "Join the conversation"

reaction_endpoint = "https://reaction.tienduy-nguyen-dev.workers.dev"
reaction_align = "right"
reaction_emojis = ["👍", "❤️", "🥹"]

outdate_alert_days = 180
outdate_alert_text_before = "Published"
outdate_alert_text_after = "days ago, so some details may have changed."

# Contact page
contact_title = "Get in Touch"
contact_footer_message = "Looking forward to connecting with you."

# 404 page
error_404_title = "Lost in the Journey?"
error_404_message = "The page you were looking for wandered off the path. Try the archive, or search for what you needed."
error_404_button = "Take me home"
error_404_archive = "Open archive"
error_404_search_label = "Search the blog"
error_404_search_placeholder = "Search posts…"
error_404_search_button = "Search"

footer_copyright_suffix = "All moments captured with love"

