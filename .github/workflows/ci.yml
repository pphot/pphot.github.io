name: CI - Build & Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Gozzi
        run: go install github.com/tduyng/gozzi@latest
        env:
          GOPROXY: direct

      - name: Show Gozzi version
        run: gozzi version

      - name: Build site
        # Gozzi renders pages concurrently and occasionally dies on a map race.
        # Retrying is cheaper than a red build on an upstream bug.
        run: |
          for attempt in 1 2 3; do
            if gozzi build; then
              exit 0
            fi
            echo "gozzi build failed on attempt $attempt"
          done
          exit 1

      - name: Validate build output
        run: |
          echo "Validating build output..."
          if [ ! -d "public" ]; then
            echo "public directory not found"
            exit 1
          fi
          if [ ! -f "public/index.html" ]; then
            echo "index.html not found"
            exit 1
          fi
          echo "Build output looks valid"
          echo "Build size: $(du -sh public | cut -f1)"
          echo "Files generated: $(find public -type f | wc -l)"
