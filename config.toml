# Atom feed author. Sub-tables come last: a plain key after a table header would
# belong to that table instead of [extra].
[extra.author]
name = "Phuong"
email = "pphot@gmail.com"

[[extra.contact_methods]]
icon = "✉️"
label = "Email"
value = "pphot@gmail.com"
url = "mailto:pphot@gmail.com"

[[extra.contact_methods]]
icon = "📷"
label = "Instagram"
value = "@phuong_photo"
url = "https://instagram.com/phuong_photo"
new_tab = true

[[extra.contact_methods]]
icon = "💻"
label = "GitHub"
value = "pphot"
url = "https://github.com/pphot"
new_tab = true

[plugins.fingerprint]
enabled = true

# Gozzi renders $math$ delimiters and ```mermaid fences by default. Mermaid
# works because main.js loads the diagram library when a page has one. Math has
# no marker in the emitted HTML and needs a full KaTeX bundle, so it stays off.
[plugins.markdown]
math = false

[taxonomies]
tags = { enabled = true, paginate_by = 0 }
categories = { enabled = true, paginate_by = 0 }
series = { enabled = true, paginate_by = 0 }