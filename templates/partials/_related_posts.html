{{- $related := related_posts .Page .Posts -}}
{{- if $related }}
<section class="related-posts">
    <h3>You may also like</h3>
    <ul class="related-list">
        {{ range $related }}
        <li>
            <a href="{{ .Permalink }}">
                <span class="date">{{ date .Config.date "2 Jan 2006" }}</span>
                <span class="title">{{ .Title }}</span>
            </a>
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
