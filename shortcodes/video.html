<figure class="video">
    <div class="video-embed">
        {{- if .embed }}
        <iframe src="{{ .src }}" title="{{ .title }}" loading="lazy" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        {{- else }}
        <video controls preload="metadata" playsinline{{ if .poster }} poster="{{ .poster }}"{{ end }}>
            <source src="{{ .src }}" />
        </video>
        {{- end }}
    </div>
    {{- if .caption }}
    <figcaption>{{ .caption }}</figcaption>
    {{- end }}
</figure>
