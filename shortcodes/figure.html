{{- $align := "center" }}{{ if .align }}{{ $align = .align }}{{ end -}}
{{- $size := "" }}{{ if .size }}{{ $size = printf " figure-%s" .size }}{{ end -}}
<figure class="figure figure-{{ $align }}{{ $size }}">
    <img src="{{ .src }}" alt="{{ .alt }}" loading="lazy" decoding="async" />
    {{- if .caption }}
    <figcaption>{{ .caption }}</figcaption>
    {{- end }}
</figure>
