{{ template "partials/_open.html" (dict "Site" .Site "Page" .Page "Section" .Section "Class" "about-page") }}

        <main id="main">
            <div class="container">
                <article class="about-content">
                    <header class="about-header">
                        <img src="{{ .Site.Config.extra.avatar }}" alt="" class="about-avatar" width="120" height="120" />
                        <h1>{{ priority .Page.Config.title .Site.Config.extra.about_title }}</h1>
                        <p class="about-subtitle">{{ .Site.Config.extra.bio }}</p>
                    </header>

                    <div class="prose">{{ .Page.Content }}</div>
                </article>
            </div>
        </main>

{{ template "partials/_close.html" (dict "Site" .Site) }}
